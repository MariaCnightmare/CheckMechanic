name: Release (build installer + upload to S3)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2). If empty and tag is vX.Y.Z, it uses tag."
        required: false
        default: ""
      notes_url:
        description: "Release notes URL (optional). If empty, uses GitHub Releases URL."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    env:
      RELEASE_PREFIX: checkmechanic

      # Required (GitHub Secrets)
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      # Optional (GitHub Vars)
      PUBLIC_BASE_URL: ${{ vars.CHECKMECHANIC_PUBLIC_BASE_URL }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          $ref = "${{ github.ref }}"
          $version = ""

          if ($inputVersion -and $inputVersion.Trim().Length -gt 0) {
            $version = $inputVersion.Trim()
          }
          elseif ($ref -like "refs/tags/v*") {
            $tag = $ref.Replace("refs/tags/", "")
            $version = $tag.TrimStart("v")
          }
          else {
            throw "version is required. Use workflow_dispatch input or push a tag vX.Y.Z."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version"

      - name: Build installer zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          pwsh -NoProfile -ExecutionPolicy Bypass -File ".\scripts\build_installer_zip.ps1" -Configuration Release -Version $version

      - name: Locate artifact zip
        id: artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -File -Filter "CheckMechanic-Setup.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "CheckMechanic-Setup.zip not found." }
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "ZIP: $($zip.FullName)"

      - name: Extract Setup.exe from zip
        id: extract
        shell: pwsh
        run: |
          $zipPath = "${{ steps.artifact.outputs.zip_path }}"
          $version = "${{ steps.ver.outputs.version }}"

          $outDir = Join-Path $env:RUNNER_TEMP ("checkmechanic_release_" + $version)
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Path $outDir | Out-Null

          Expand-Archive -Path $zipPath -DestinationPath $outDir -Force

          $setup = Get-ChildItem -Path $outDir -Recurse -File -Filter "Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found inside zip." }

          "setup_path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "out_dir=$outDir" >> $env:GITHUB_OUTPUT
          Write-Host "SETUP: $($setup.FullName)"

      - name: Compute SHA256 of Setup.exe
        id: hash
        shell: pwsh
        run: |
          $setupPath = "${{ steps.extract.outputs.setup_path }}"
          $h = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $h"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: checkmechanic-release

      - name: Upload Setup.exe and zip to S3
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $setupPath = "${{ steps.extract.outputs.setup_path }}"
          $zipPath = "${{ steps.artifact.outputs.zip_path }}"
          $bucket = "${{ env.S3_BUCKET }}"
          $prefix = "${{ env.RELEASE_PREFIX }}"

          $s3SetupKey = "$prefix/releases/$version/Setup.exe"
          $s3ZipKey   = "$prefix/releases/$version/CheckMechanic-Setup.zip"

          aws s3 cp "$setupPath" "s3://$bucket/$s3SetupKey" `
            --content-type "application/octet-stream" `
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp "$zipPath" "s3://$bucket/$s3ZipKey" `
            --content-type "application/zip" `
            --cache-control "public, max-age=31536000, immutable"

          Write-Host "Uploaded:"
          Write-Host "  s3://$bucket/$s3SetupKey"
          Write-Host "  s3://$bucket/$s3ZipKey"

      - name: Generate latest.json
        id: manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $sha = "${{ steps.hash.outputs.sha256 }}"
          $bucket = "${{ env.S3_BUCKET }}"
          $prefix = "${{ env.RELEASE_PREFIX }}"
          $notes = "${{ github.event.inputs.notes_url }}"
          $region = "${{ env.AWS_REGION }}"

          $publicBase = "${{ env.PUBLIC_BASE_URL }}"
          if (-not $publicBase -or $publicBase.Trim().Length -eq 0) {
            $publicBase = "https://$bucket.s3.$region.amazonaws.com/$prefix"
          }

          if (-not $notes -or $notes.Trim().Length -eq 0) {
            $repo = "${{ github.repository }}"
            $notes = "https://github.com/$repo/releases/tag/v$version"
          }

          $downloadUrl = "$publicBase/releases/$version/Setup.exe"

          $manifest = [ordered]@{
            version = $version
            download_url = $downloadUrl
            release_notes_url = $notes
            sha256 = $sha
          }

          $json = ($manifest | ConvertTo-Json -Depth 5)
          $path = Join-Path $env:RUNNER_TEMP "latest.json"
          $json | Out-File -FilePath $path -Encoding utf8

          "latest_path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "latest.json:"
          Get-Content $path

      - name: Upload latest.json (no cache)
        shell: pwsh
        run: |
          $bucket = "${{ env.S3_BUCKET }}"
          $prefix = "${{ env.RELEASE_PREFIX }}"
          $latestPath = "${{ steps.manifest.outputs.latest_path }}"
          $s3Key = "$prefix/latest.json"

          aws s3 cp "$latestPath" "s3://$bucket/$s3Key" `
            --content-type "application/json" `
            --cache-control "no-store, max-age=0"

          Write-Host "Uploaded latest.json: s3://$bucket/$s3Key"

      - name: Invalidate CloudFront (latest.json only)
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        shell: pwsh
        run: |
          $dist = "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          $prefix = "${{ env.RELEASE_PREFIX }}"
          aws cloudfront create-invalidation --distribution-id $dist --paths "/$prefix/latest.json"
          Write-Host "Invalidated: /$prefix/latest.json"

      - name: Upload artifact to GitHub (optional)
        uses: actions/upload-artifact@v4
        with:
          name: CheckMechanic-Setup
          path: ${{ steps.artifact.outputs.zip_path }}
