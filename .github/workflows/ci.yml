name: ci

on:
  push:
    branches:
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (poc)
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/poc_streamlit/requirements.txt
      - name: Compile all
        run: |
          python -m compileall .

